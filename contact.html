  <section class="contact-section">

  
  <div class="contact-container">
    <div class="contact-info">
      <h3>Contact Me!</h3>
      <p>Whether you're interested in prices, have questions about my classes, or just want to say hi, I'd love to hear from you.</p>
      <div class="artistic-blob">🎨</div>
    </div>

    <form action="mailto:nataliasenchenyaart@gmail.com" method="post" enctype="text/plain" class="artistic-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="Name" placeholder="Natalia Senchenya" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="Email" placeholder="hello@email.com" required>
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="Message" rows="5" placeholder="Tell me about your vision..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">
        Send Message <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </div>
</section>
